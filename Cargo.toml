[package]
name = "websocket2serial"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "WebSocket↔串口 本机常驻透传工具"
publish = false

# 依赖版本按实现计划 + M0 可行性验证锁定，保证 MSRV = 1.77.2（Windows 7 SP1 / Ubuntu 18.04）。
# 关键锁定：
# - tokio 用 "=1.38.0"（计划指定 1.38；1.54.x 起 MSRV 升至 1.85）。
# - hyper-util 0.1.21 起使用 edition 2024（要求 Cargo >= 1.85），固定 0.1.20。
# - 其余依赖均选 rust_version <= 1.77 的版本。

[dependencies]
tokio = { version = "=1.38.0", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "net",
    "time",
    "sync",
    "io-util",
    "fs",
] }
axum = { version = "0.7", features = ["ws"] }
serialport = "4.5"
# 数据/管理 WS 服务：`hyper` 用于 `Incoming` 请求体类型，`hyper-util` 的
# `server`/`http1`/`tokio` 用于 `serve_with_nodelay` 的自定义 accept + 升级。
hyper = "1"
hyper-util = { version = "=0.1.20", features = ["tokio", "server", "http1", "service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=0.8.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-appender = "0.2"
base64 = "0.22"
thiserror = "1"
uuid = { version = "=1.11.0", features = ["v4"] }
futures-util = "0.3"
dirs = "5"
open = "5"
# 数据 WS 在升级阶段用 max_message_size 拒绝超大帧；读取侧据此识别
# `Error::Capacity(MessageTooLong)` 以补发 1009（与 axum 0.7 传递依赖的 0.24 一致）。
tungstenite = "0.24"
# clap 较新的 4.5.x 把 clap_lex 抬到 1.1.1（edition 2024）。固定到早期 4.5.x，
# 其 clap_lex 仍为 edition 2021 的 0.7 系列。
clap = { version = "=4.5.4", features = ["derive"] }

# MSRV 锁定：tracing-appender 依赖的 `time` 0.3.x 较新版本把 `time-core` 抬到
# 0.1.9（edition 2024，要求 Cargo >= 1.85）。固定 `time` 到仍为 edition 2021 的版本。
# `time` 依赖的 `powerfmt` 0.2.1 起要求 rustc 1.79，一并固定。
time = "=0.3.36"
powerfmt = "=0.2.0"

# MSRV 锁定：toml -> toml_edit -> indexmap -> hashbrown 链，较新版本解析到
# hashbrown 0.17（edition 2024）。固定 toml_edit 与 indexmap 到仍为 edition 2021 的版本。
toml_edit = "=0.22.20"
indexmap = "=2.2.6"

# Origin 白名单解析依赖，同时约束 reqwest/tokio-tungstenite 传递依赖的 url。
# 较新 url 用 idna 1.x（ICU4X，icu_collections 2.4.0 起 edition 2024），固定到仍用 idna 0.5 的版本。
url = "=2.5.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# 最后支持 Win7 的 WebView2 SDK 1.0.1518.46；0.23 起升级 SDK，勿浮动。
webview2-com = "=0.22.0"
windows = { version = "=0.44.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
# 测试用 `tokio::time::advance` 与 `#[tokio::test(start_paused = true)]`（任务 6/7 超时用例），
# 与主依赖统一锁定到 1.38.0（test-util 仅编译测试目标，不影响产物/MSRV）。
tokio = { version = "=1.38.0", features = ["test-util"] }
# MSRV 锁定：tempfile 传递依赖的 fastrand 较新版本用 getrandom 0.4（edition 2024）。
# 固定 fastrand 到仍用 getrandom 0.2 的版本。
fastrand = "=2.1.0"
# MSRV 锁定：reqwest 传递依赖的 encoding_rs 较新版本（0.8.42）用 edition 2024。
encoding_rs = "=0.8.34"
tokio-tungstenite = { version = "0.21", default-features = false, features = [
    "connect",
    "handshake",
] }
reqwest = { version = "0.11", default-features = false, features = ["json"] }
