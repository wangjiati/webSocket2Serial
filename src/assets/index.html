<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebSocket2Serial 管理页</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>WebSocket2Serial</h1>
      <span id="conn-status" class="badge waiting">连接中…</span>
      <nav class="page-links">
        <a href="/assistant" target="_blank" rel="noopener">串口助手 ↗</a>
        <a href="/test" target="_blank" rel="noopener">功能测试 ↗</a>
      </nav>
    </header>

    <main>
      <section id="overview">
        <h2>概览</h2>

        <div class="info-grid">
          <div class="info-item">
            <span class="label">版本</span>
            <span id="version">—</span>
          </div>
          <div class="info-item">
            <span class="label">管理地址</span>
            <code id="admin-url">—</code>
            <button id="copy-url" type="button" class="small">复制</button>
          </div>
          <div class="info-item">
            <label class="label">
              <input type="checkbox" id="admin-toggle" />
              管理服务
            </label>
            <span id="admin-note" class="muted"></span>
          </div>
        </div>

        <h3>串口</h3>
        <div id="ports" class="panel">
          <table>
            <thead>
              <tr>
                <th>路径</th>
                <th>VID/PID</th>
                <th>厂商</th>
                <th>产品</th>
                <th>序列号</th>
                <th>类型</th>
              </tr>
            </thead>
            <tbody id="ports-body"></tbody>
          </table>
        </div>

        <h3>会话</h3>
        <div id="sessions" class="panel">
          <table>
            <thead>
              <tr>
                <th>会话</th>
                <th>状态</th>
                <th>串口 / 参数</th>
                <th>RX / TX</th>
                <th>最近断线</th>
                <th>最近错误</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="sessions-body"></tbody>
          </table>
        </div>
      </section>

    </main>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
